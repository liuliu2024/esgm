<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>专业作业台 · 碳有据</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { --paper: #f4f8f9; --surface: #fff; --ink: #142b40; --muted: #496171; --line: #dce7e9; --accent: #076d66; --accent-soft: #e5f4f0; }
    #factor-references > summary { color: var(--accent); font-weight: 650; cursor: pointer; }
  </style>
  <script type="module" src="/professional.mjs"></script>
</head>
<body>
  <header>
    <h1>专业作业台</h1>
  </header>
  <main>
    <p id="workspace-error" role="alert"></p>
    <details id="factor-references" class="panel">
      <summary>官方因子查询</summary>
      <form id="factor-reference-form" class="actions">
        <label for="factor-accounting-basis">核算口径</label>
        <select id="factor-accounting-basis">
          <option value="product_footprint">产品电力碳足迹</option>
          <option value="organization_electricity_co2">电力消费二氧化碳排放</option>
        </select>
        <label for="factor-data-year">数据年份</label>
        <select id="factor-data-year">
          <option value="2024">2024 年</option>
          <option value="2023">2023 年</option>
        </select>
        <button id="factor-reference-search" type="submit" disabled>查询全国因子</button>
      </form>
      <p id="factor-reference-status" role="status"></p>
      <p id="factor-reference-error" role="alert"></p>
      <ul id="factor-reference-results" class="history-list" hidden></ul>
    </details>
    <div class="layout">
      <section class="panel" aria-labelledby="queue-heading">
        <div class="heading">
          <h2 id="queue-heading">复核队列</h2>
          <button type="button" id="refresh-queue">刷新</button>
        </div>
        <p id="queue-status" role="status">正在加载任务</p>
        <ul id="queue" class="task-list" hidden></ul>
        <button type="button" id="next-page" hidden>加载更多</button>
      </section>
      <section class="panel" aria-labelledby="detail-heading">
        <h2 id="detail-heading" tabindex="-1">受理详情</h2>
        <p id="detail-status" role="status">请选择一项任务</p>
        <div id="case-detail" class="stack" hidden>
          <div class="heading">
            <span id="case-status" class="status"></span>
            <small id="case-revision"></small>
          </div>
          <section>
            <h3>办理用途</h3>
            <p id="purpose"></p>
          </section>
          <details id="case-scenario-preparation" hidden>
            <summary>受理时的准备材料与报告要求</summary>
            <div></div>
          </details>
          <section id="scope-section" aria-labelledby="scope-heading" hidden>
            <h3 id="scope-heading">申报范围</h3>
            <dl>
              <dt>报告对象</dt>
              <dd id="scope-subject"></dd>
              <dt>地区</dt>
              <dd id="scope-jurisdiction"></dd>
              <dt>报告年度</dt>
              <dd id="scope-year"></dd>
              <dt>交付对象</dt>
              <dd id="scope-recipient"></dd>
            </dl>
          </section>
          <section id="correction-section" hidden>
            <h3>最新补正</h3>
            <p id="correction"></p>
          </section>
          <section id="return-section" hidden>
            <h3>退回原因</h3>
            <p id="return-reason"></p>
          </section>
          <section>
            <h3>当前材料清单</h3>
            <p id="evidence-status" role="status"></p>
            <ul id="evidence-list" class="task-list" hidden></ul>
          </section>
          <section id="revision-evidence-section" class="stack" hidden>
            <h3>提交版本证据</h3>
            <div>
              <label for="evidence-revision">提交版本</label>
              <select id="evidence-revision"></select>
            </div>
            <p id="revision-evidence-status" role="status"></p>
            <p id="revision-evidence-error" role="alert"></p>
            <ul id="revision-evidence-list" class="history-list" hidden></ul>
          </section>
          <p id="review-error" role="alert"></p>
          <form id="review-form" hidden>
            <label for="reason">退回理由</label>
            <textarea id="reason" maxlength="500" required></textarea>
            <div class="actions">
              <button class="primary" type="button" id="approve">批准</button>
              <button type="submit" id="return">退回补正</button>
            </div>
          </form>
          <section id="preserved-reason" hidden>
            <h3>未提交的退回理由</h3>
            <p id="preserved-reason-text"></p>
          </section>
          <details id="report-review">
            <summary>演示稿复核</summary>
            <div class="stack">
              <p id="report-review-list-status" role="status"></p>
              <p id="report-review-list-error" role="alert"></p>
              <ul id="report-review-list" class="task-list"></ul>
              <button type="button" id="report-review-more" hidden>加载更多稿件</button>
              <p id="report-review-status" role="status"></p>
              <article id="report-review-draft" class="notice stack" hidden>
                <h3 id="report-review-title" tabindex="-1"></h3>
                <strong id="report-review-watermark"></strong>
                <p id="report-review-summary"></p>
                <p id="report-review-purpose"></p>
                <dl id="report-review-scope" hidden></dl>
                <ul id="report-review-items" class="history-list"></ul>
                <p id="report-review-decision"></p>
              </article>
              <p id="report-review-error" role="alert"></p>
              <form id="report-review-form" hidden>
                <label for="report-review-reason">退回稿件原因</label>
                <textarea id="report-review-reason" maxlength="500" required></textarea>
                <div class="actions">
                  <button class="primary" type="button" id="report-review-approve">标记演示复核通过</button>
                  <button type="submit" id="report-review-return">退回演示稿</button>
                </div>
              </form>
            </div>
          </details>
          <details>
            <summary>办理历史</summary>
            <div id="history"></div>
          </details>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
