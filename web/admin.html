<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组织审计 · 碳有据</title>
  <link rel="stylesheet" href="/shared.css">
  <script type="module" src="/admin.mjs"></script>
</head>
<body>
  <header>
    <h1>组织审计</h1>
  </header>
  <main>
    <section class="panel" aria-labelledby="audit-heading">
      <div class="heading">
        <h2 id="audit-heading">受理记录</h2>
        <button type="button" id="refresh-audit">刷新</button>
      </div>
      <p id="audit-error" role="alert"></p>
      <p id="audit-status" role="status">正在加载记录</p>
      <div id="audit-table" class="table-scroll" hidden>
        <table aria-label="本组织受理审计记录">
          <thead>
            <tr>
              <th scope="col">时间</th>
              <th scope="col">受理单</th>
              <th scope="col">版本</th>
              <th scope="col">动作</th>
              <th scope="col">原因或补正</th>
            </tr>
          </thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
      <div id="audit-pagination" class="actions" hidden>
        <button type="button" id="previous-page">上一页</button>
        <span id="page-number" aria-live="polite"></span>
        <button type="button" id="next-page">下一页</button>
      </div>
    </section>
  </main>
</body>
</html>
