name: Verify foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbon_test
          POSTGRES_PASSWORD: integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARBON_TEST_MIGRATION_DATABASE_URL: postgres://postgres:integration_only@127.0.0.1:5432/carbon_test
      CARBON_TEST_APP_DATABASE_URL: postgres://carbon_test_app:integration_app_only@127.0.0.1:5432/carbon_test
      CARBON_TEST_SCANNER_DATABASE_URL: postgres://carbon_test_scanner:integration_scan_only@127.0.0.1:5432/carbon_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Provision the test login
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U postgres -d carbon_test
          -c "CREATE ROLE carbon_test_app LOGIN PASSWORD 'integration_app_only'"
          -c "CREATE ROLE carbon_test_scanner LOGIN PASSWORD 'integration_scan_only'"
      - run: npm ci --ignore-scripts
      - run: npm test
